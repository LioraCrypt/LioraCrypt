version: 2

models:
  - name: fct_daily_klines
    description: >
      Table de faits : une ligne par paire et par jour (bougies clôturées). Prix, volumes,
      rendements simple et log (NULL si la veille manque), moyennes mobiles 7 et 30 jours et
      volatilité 30 jours annualisée, sur des fenêtres en jours calendaires.
      Indicateurs descriptifs, contenu éducatif : aucune prédiction, aucun conseil.
    columns:
      - name: symbol
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_pairs')
                field: symbol
      - name: trade_date
        description: "Jour de la bougie (date d'ouverture, UTC)"
        data_tests: [not_null]
      - name: close_price
        data_tests: [not_null]
      - name: daily_return
        description: "Rendement simple (close / close de la veille - 1) ; NULL si la veille manque"
      - name: log_return
        description: "Rendement logarithmique ln(close / close de la veille) ; base des volatilités et corrélations"
      - name: ma_7d
        description: "Moyenne des clôtures sur 7 jours calendaires (jour inclus)"
      - name: ma_30d
        description: "Moyenne des clôtures sur 30 jours calendaires (jour inclus)"
      - name: nb_jours_ma_7d
        description: "Nombre de jours réellement présents dans la fenêtre de 7 jours (7 = complète)"
      - name: nb_jours_ma_30d
        description: "Nombre de jours réellement présents dans la fenêtre de 30 jours (30 = complète)"
      - name: volatility_30d_annualized
        description: "Écart-type des rendements log sur 30 jours calendaires × racine(365)"
      - name: nb_rendements_30d
        description: "Nombre de rendements utilisés pour la volatilité (29 ou 30 attendus)"
      - name: loaded_at
        data_tests: [not_null]

  - name: mart_pair_overview
    description: >
      Une ligne par paire : dernière bougie clôturée, rendements 1/7/30 jours, moyennes,
      volatilité, et informations de fraîcheur (dernière bougie, date de chargement) que l'API
      utilise pour masquer une paire périmée. is_fresh repose sur un seuil provisoire.
    columns:
      - name: symbol
        data_tests: [unique, not_null]
      - name: last_trade_date
        data_tests: [not_null]
      - name: last_close_time
        data_tests: [not_null]
      - name: last_close_price
        data_tests: [not_null]
      - name: last_loaded_at
        description: "Date de chargement dans BigQuery de la dernière bougie"
        data_tests: [not_null]
      - name: hours_since_last_close
        description: "Heures écoulées depuis la clôture de la dernière bougie, au moment du dbt build"
      - name: is_fresh
        description: "Vrai si la dernière clôture date de moins de freshness_max_hours (48 h provisoire), au moment du dbt build"
        data_tests: [not_null]
      - name: computed_at
        description: "Moment du calcul (dbt build)"

  - name: fct_return_correlations
    description: >
      Corrélations de Pearson des rendements log journaliers entre paires de même devise de
      cotation, sur 30, 90 et 365 jours calendaires se terminant à la dernière date commune.
    columns:
      - name: quote_asset
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [USDT, EUR]
      - name: window_days
        data_tests:
          - accepted_values:
              arguments:
                values: [30, 90, 365]
                quote: false
      - name: correlation
        description: "Coefficient entre -1 et 1"
        data_tests: [not_null]
      - name: nb_jours
        description: "Nombre de jours communs utilisés dans la fenêtre"

seeds:
  - name: dim_pairs
    description: "Dimension des 6 paires du périmètre : actif de base, devise de cotation, nom."
    config:
      column_types:
        symbol: string
        base_asset: string
        quote_asset: string
        base_name: string
    columns:
      - name: symbol
        data_tests: [unique, not_null]
      - name: quote_asset
        data_tests:
          - accepted_values:
              arguments:
                values: [USDT, EUR]
